<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Click a Unicode text face to copy it.">
    <title>Textfaces</title>
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap header-grid">
        <div>
          <h1>textfaces</h1>
          <p class="intro">
            Click to copy to clipboard. Paste anywhere.
          </p>
        </div>
        <div id="copy-status" class="copy-status" role="status" aria-live="polite">
          Click any face to copy it.
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="faces" class="face-list" aria-label="Text faces"></div>
    </main>
  </body>
</html>
